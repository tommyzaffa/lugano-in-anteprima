# Catalogo editoriale — Lugano in anteprima
# ------------------------------------------------------------------
# Ogni luogo è collegato a un oggetto OpenStreetMap (campo osm): le coordinate
# NON sono scritte a mano ma risolte dallo script scripts/catalog/build-catalog.ts.
#
# Convenzioni:
#   hours: osm            -> usa opening_hours di OSM (stato «osm», da verificare)
#   hours: always         -> spazio pubblico sempre accessibile (stato editoriale)
#   hours: unknown        -> orari mancanti: il pianificatore li segnala come incerti
#   hours: { osm: "…", status: editorial|estimate, note: "…" } -> orario redazionale
#   prices: preset (grotto, osteria, pizzeria, fine, cafe, gelato, bar, free) oppure lista
#   Tutti i prezzi sono STIME salvo diversa indicazione: non sono listini ufficiali.
#   access.wheelchair: osm -> usa il tag OSM wheelchair se presente, altrimenti «unknown»
#   atmosphere: caratteristica abituale curata dalla redazione, NON affluenza reale.
# Ultimo controllo redazionale: 2026-09-28 (demo del pilota).

